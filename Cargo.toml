[package]
name = "laravel-parity"
version = "0.2.1"
edition = "2024"
description = "Runs the same requests through an old and an upgraded Laravel app and reports what differs"
license = "MIT"
repository = "https://github.com/syahrul84/laravel-parity"

[[bin]]
name = "laravel-parity"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust"] }
regex = "1.13.1"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
toml = "1.1.8"

[profile.release]
strip = true
lto = "thin"
